name: Deploy AI Review to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Automated Unit Tests & Report Validation
        run: |
          npm test
          python3 -m unittest discover tests
          npm run validate-reports
          npm run typecheck

      - name: Check Target Repository & Run Deterministic Analysis
        run: |
          if [ -d "target" ] && [ -n "$(find target -mindepth 1 ! -name '.gitkeep' ! -name 'README.md' 2>/dev/null | head -n 1)" ]; then
            echo "Target repository detected. Running deterministic code & metric analyzer..."
            python3 scripts/analyze-target.py target
            echo "✅ Target repository successfully analyzed."
          else
            echo "ℹ️ No target repository detected. Proceeding with pre-compiled metrics."
          fi

      - name: Compile Model Reports & Build Dashboard
        env:
          VITE_BASE_PATH: /review1/
        run: |
          npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
